[project]
name = "packitless"
version = "0.1.0"
description = "Budget-aware context compression for repetitive LLM payloads."
requires-python = ">=3.11"
dependencies = [
    "drain3>=0.9.11",
    "anthropic>=0.40.0",
]

[project.scripts]
packitless = "packitless.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packitless"]
